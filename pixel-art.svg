<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- Pixel Art Security Shield -->
  <g id="shield-pixel">
    <rect x="10" y="10" width="10" height="10" fill="#FFA500"/>
    <rect x="20" y="10" width="10" height="10" fill="#FFA500"/>
    <rect x="10" y="20" width="10" height="10" fill="#FFA500"/>
    <rect x="20" y="20" width="10" height="10" fill="#FFA500"/>
    <rect x="10" y="30" width="10" height="10" fill="#FF8C00"/>
    <rect x="20" y="30" width="10" height="10" fill="#FF8C00"/>
  </g>

  <!-- Pixel Art Lock -->
  <g id="lock-pixel">
    <rect x="5" y="15" width="20" height="15" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
    <rect x="8" y="10" width="5" height="8" fill="#FFA500" stroke="#FF8C00" stroke-width="1"/>
    <rect x="17" y="10" width="5" height="8" fill="#FFA500" stroke="#FF8C00" stroke-width="1"/>
  </g>

  <!-- Pixel Art Detective/Investigator Character -->
  <g id="pixel-detective">
    <rect x="6" y="0" width="4" height="4" fill="#FFD699"/> <!-- head -->
    <rect x="4" y="4" width="8" height="2" fill="#333333"/> <!-- hat -->
    <rect x="4" y="6" width="2" height="2" fill="#000000"/> <!-- left eye -->
    <rect x="8" y="6" width="2" height="2" fill="#000000"/> <!-- right eye -->
    <rect x="5" y="8" width="4" height="1" fill="#666666"/> <!-- nose -->
    <rect x="4" y="10" width="8" height="2" fill="#FFB366"/> <!-- body top -->
    <rect x="2" y="12" width="3" height="4" fill="#8B4513"/> <!-- left arm -->
    <rect x="9" y="12" width="3" height="4" fill="#8B4513"/> <!-- right arm -->
    <rect x="4" y="12" width="2" height="4" fill="#333333"/> <!-- left leg -->
    <rect x="8" y="12" width="2" height="4" fill="#333333"/> <!-- right leg -->
  </g>

  <!-- Animated Background Grid -->
  <defs>
    <pattern id="pixel-grid" x="40" y="40" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="40" height="40" fill="none" stroke="#333333" stroke-width="1"/>
    </pattern>
    <pattern id="pixel-dots" x="20" y="20" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2" fill="#FFA500" opacity="0.1"/>
    </pattern>
  </defs>
</svg>
