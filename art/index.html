<style>
  :root { --black:#000; --paper:#f2f2ee; --dim:#8f8f89; --rule:#3a3a37; --red:#d8402f; --display:Archivo, system-ui, sans-serif; --type:'Special Elite', ui-monospace, monospace; }
  html { background:var(--black); color:var(--paper); font-family:Archivo, system-ui, sans-serif; color-scheme:dark; }

  .film { position:fixed; inset:0; z-index:2; pointer-events:none; }

  header { position:sticky; top:0; z-index:4; display:flex; justify-content:space-between; align-items:baseline; padding:22px 28px; font-size:.9rem; background:linear-gradient(#000 70%, transparent); }

<script>
(() => {
  // decrypt the page in the browser; a wrong password fails the AES-GCM check
  const ITER = 600000, raw = Uint8Array.from(atob(document.getElementById('vault').textContent.trim()), c => c.charCodeAt(0));
  const form = document.getElementById('gate-form'), input = document.getElementById('gate-pass'), msg = document.getElementById('gate-msg');
  const open = async pass => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: raw.slice(0, 16), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const sealed = raw.slice(16);
    const data = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: sealed.slice(0, 12) }, key, sealed.slice(12))));
    const urls = {};
    await Promise.all(Object.entries(data.assets).map(async ([path, [file, type]]) => {
      const buf = new Uint8Array(await (await fetch(file)).arrayBuffer());
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
      urls[path] = URL.createObjectURL(new Blob([plain], { type }));
    }));
    let main = data.main, dialog = data.dialog;
    for (const [path, url] of Object.entries(urls)) { main = main.split('"' + path + '"').join('"' + url + '"'); dialog = dialog.split('"' + path + '"').join('"' + url + '"'); }
    document.getElementById('vault-main').innerHTML = main;
    document.body.insertAdjacentHTML('beforeend', dialog);
    start();
  };
  const tryOpen = async (pass, quiet) => {
    msg.className = 'gate-msg'; if (!quiet) msg.textContent = 'Opening\u2026';
    try { await open(pass); try { sessionStorage.setItem('art-pass', pass); } catch {} }
    catch { if (!quiet) { msg.className = 'gate-msg bad'; msg.textContent = 'Wrong password. Try again.'; input.select(); } }
  };
  form.addEventListener('submit', e => { e.preventDefault(); tryOpen(input.value, false); });
  let saved = null; try { saved = sessionStorage.getItem('art-pass'); } catch {}
  if (saved) tryOpen(saved, true); else input.focus();

  // what the page does once it is open: the film and the lightbox
  function start() {
    const film = document.getElementById('film');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { film.removeAttribute('autoplay'); film.pause(); film.controls = true; }
    else film.play().catch(() => {});
    const lb = document.getElementById('lightbox'), lbImg = lb.querySelector('img');
    document.querySelectorAll('button[data-full]').forEach(b => b.addEventListener('click', () => {
      const im = b.querySelector('img'); lbImg.src = b.dataset.full; lbImg.alt = im ? im.alt : 'The still digital illustration';
      if (lb.showModal) lb.showModal(); else window.open(b.dataset.full, '_blank');
    }));
    lb.addEventListener('click', () => lb.close());
  }
})();
</script>
<script>
(() => {
  // one menu open at a time; a tap outside or Escape closes it
  const menus = [...document.querySelectorAll('.site-nav .menu')];
  menus.forEach(m => m.addEventListener('toggle', () => { if (m.open) menus.forEach(o => { if (o !== m) o.open = false; }); }));
  document.addEventListener('click', e => menus.forEach(m => { if (!m.contains(e.target)) m.open = false; }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') menus.forEach(m => { m.open = false; }); });
})();
</script>
