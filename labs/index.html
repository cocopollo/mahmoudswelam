<title>DFIR Labs | Mahmoud Swelam</title>

<style>
  :root { --black:#000; --paper:#f2f2ee; --dim:#8f8f89; --rule:#3a3a37; }
  html { background:var(--black); color:var(--paper); font-family:Archivo, system-ui, sans-serif; }
  body { margin:0; }
  a { color:var(--paper); }
  a:focus-visible, summary:focus-visible { outline:1px solid var(--paper); outline-offset:4px; }

  header { position:sticky; top:0; z-index:3; display:flex; justify-content:space-between; align-items:baseline; padding:22px 28px; font-size:.9rem; background:linear-gradient(#000 70%, transparent); }
  header strong a { font-stretch:80%; font-weight:700; text-decoration:none; }
  header nav a { text-decoration:none; margin-left:24px; }
  header nav a:hover, header nav a[aria-current] { text-decoration:underline; text-underline-offset:4px; }

  main { max-width:68rem; margin:0 auto; padding:0 28px 6rem; }
  .intro { padding:14vh 0 8vh; max-width:34rem; }
  h1 { font-size:clamp(3.2rem, 9vw, 7.6rem); font-stretch:62%; font-weight:800; line-height:.86; margin:0 0 1.6rem; }
  p { font-size:1.05rem; line-height:1.55; max-width:40ch; margin:0 0 1rem; }
  .platforms a { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; font-size:1.4rem; font-stretch:80%; font-weight:600; text-decoration:none; padding:.35rem 0; border-bottom:1px solid var(--rule); max-width:22rem; }
  .platforms a span { color:var(--dim); font-size:.85rem; font-weight:400; font-stretch:100%; }
  .platforms a:hover { border-color:var(--paper); }

  .labs { list-style:none; margin:0; padding:0; counter-reset:lab; }
  .lab { display:grid; grid-template-columns:5.5rem 1fr; gap:0 2rem; padding:2.2rem 0; border-top:1px solid var(--rule); }
  .lab:last-child { border-bottom:1px solid var(--rule); }
  .idx { font-stretch:62%; font-weight:700; font-size:1.6rem; font-variant-numeric:tabular-nums; color:var(--dim); line-height:1; padding-top:.35rem; }
  .lab h2 { font-size:clamp(2.2rem, 4.6vw, 3.6rem); font-stretch:66%; font-weight:750; line-height:.92; margin:0 0 .9rem; }
  .meta { display:flex; flex-wrap:wrap; gap:.6rem 1.6rem; align-items:center; font-size:.85rem; color:var(--dim); margin-bottom:1.1rem; }
  .diff { display:inline-flex; align-items:center; gap:10px; color:var(--paper); }
  .diff i { display:inline-flex; gap:4px; }
  .diff b { width:14px; height:2px; background:var(--rule); }
  .diff b.on { background:var(--paper); width:22px; }
  .row { display:grid; grid-template-columns:7.5rem 1fr; gap:1rem; font-size:1rem; line-height:1.5; margin:0 0 .5rem; max-width:none; }
  .row span:first-child { color:var(--dim); font-size:.85rem; padding-top:.15rem; }
  details { margin-top:.9rem; max-width:48rem; }
  summary { cursor:pointer; font-stretch:80%; font-weight:600; width:max-content; border-bottom:1px solid var(--rule); padding-bottom:2px; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:' +'; color:var(--dim); }
  details[open] summary::after { content:' −'; }
  summary:hover { border-color:var(--paper); }
  details ul { margin:1rem 0 0; padding:0; list-style:none; }
  details li { position:relative; padding:.3rem 0 .3rem 1.4rem; line-height:1.5; }
  details li::before { content:''; position:absolute; left:0; top:.95rem; width:.7rem; height:1px; background:var(--dim); }
  details li.sub { padding-left:2.8rem; color:var(--dim); }
  details li.sub::before { left:1.4rem; width:.5rem; }
  .play { display:inline-block; margin-top:1rem; font-stretch:80%; font-weight:600; text-decoration:none; border-bottom:1px solid var(--rule); }
  .play:hover { border-color:var(--paper); }

  footer { max-width:68rem; margin:0 auto; padding:0 28px 3rem; font-size:.85rem; color:var(--dim); }
  footer a { text-decoration:none; border-bottom:1px solid var(--rule); }

  @media (max-width:720px) {
    header { padding:16px 18px; }
    header nav a { margin-left:14px; }
    main, footer { padding-left:18px; padding-right:18px; }
    .intro { padding:10vh 0 6vh; }
    .lab { grid-template-columns:1fr; }
    .idx { padding:0 0 .6rem; }
    .row { grid-template-columns:1fr; gap:.1rem; }
  }
  @media (max-width:400px) { header strong a { font-size:.82rem; } header nav a { margin-left:11px; } }
</style>

    <p>Forensics challenges I built and published, each one worked from a real investigation technique.</p>
    <div class="platforms">
      <a href="https://flagyard.com/" target="_blank" rel="noopener">Flagyard</a>
      <a href="https://blackhatmea.com/capture-the-flag" target="_blank" rel="noopener">BlackHat MEA CTF <span>2024, 2025</span></a>
    </div>
  </section>

  <ol class="labs" id="labs"></ol>
