<title>DFIR Labs | Mahmoud Swelam</title>
<meta name="description" content="Forensics challenges by Mahmoud Swelam, published on Flagyard and for the BlackHat MEA CTF.">
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --black:#000; --paper:#f2f2ee; --dim:#8f8f89; --rule:#3a3a37; --red:#d8402f; }
  html { background:var(--black); color:var(--paper); font-family:Archivo, system-ui, sans-serif; }
  body { margin:0; }
  a { color:var(--paper); }
  a:focus-visible, summary:focus-visible { outline:1px solid var(--paper); outline-offset:4px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }

  canvas.layer { position:fixed; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
  #ink { z-index:1; } #loupe { z-index:5; }
  .film { position:fixed; inset:0; z-index:2; pointer-events:none; }
  #grain { opacity:.11; mix-blend-mode:screen; }
  #vignette { background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.65) 100%); }

  header { position:sticky; top:0; z-index:4; display:flex; justify-content:space-between; align-items:baseline; padding:22px 28px; font-size:.9rem; background:linear-gradient(#000 70%, transparent); }
  header strong a { font-stretch:80%; font-weight:700; text-decoration:none; }
  header nav a { text-decoration:none; margin-left:24px; }
  header nav a:hover, header nav a[aria-current] { text-decoration:underline; text-underline-offset:4px; }

  main { position:relative; z-index:3; max-width:68rem; margin:0 auto; padding:0 64px 6rem 28px; }
  .case { font-family:'Special Elite', ui-monospace, monospace; font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:0 0 1rem; }

  .intro { display:grid; grid-template-columns:minmax(0, 30rem) 1fr; gap:3rem; align-items:center; min-height:86vh; padding:6vh 0 8vh; }
  .board { height:62vh; min-height:22rem; }
  h1 { font-size:clamp(3.2rem, 9vw, 7.6rem); font-stretch:62%; font-weight:800; line-height:.86; margin:0 0 1.6rem; }
  p { font-size:1.05rem; line-height:1.55; max-width:40ch; margin:0 0 1rem; }
  .platforms { margin-top:1.4rem; }
  .platforms a { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; font-size:1.4rem; font-stretch:80%; font-weight:600; text-decoration:none; padding:.35rem 0; border-bottom:1px solid var(--rule); max-width:22rem; }
  .platforms a span { color:var(--dim); font-size:.85rem; font-weight:400; font-stretch:100%; }
  .platforms a:hover { border-color:var(--paper); }

  .labs { list-style:none; margin:0; padding:0; }
  .lab { display:grid; grid-template-columns:5.5rem 1fr 9rem; gap:0 2rem; padding:2.4rem 0; border-top:1px solid var(--rule); }
  .lab:last-child { border-bottom:1px solid var(--rule); }
  .idx { font-stretch:62%; font-weight:700; font-size:1.6rem; font-variant-numeric:tabular-nums; color:var(--dim); line-height:1; padding-top:1.9rem; }
  .lab .case { margin-bottom:.6rem; }
  .lab h2 { font-size:clamp(2.2rem, 4.6vw, 3.6rem); font-stretch:66%; font-weight:750; line-height:.92; margin:0 0 1.1rem; }
  .row { display:grid; grid-template-columns:7.5rem 1fr; gap:1rem; font-size:1rem; line-height:1.5; margin:0 0 .5rem; max-width:none; }
  .row span:first-child { color:var(--dim); font-size:.85rem; padding-top:.15rem; }
  .stamp { justify-self:end; align-self:start; margin-top:2rem; font-family:'Special Elite', ui-monospace, monospace; font-size:.95rem; letter-spacing:.2em; text-transform:uppercase; color:var(--paper); border:2px solid currentColor; padding:.45rem .7rem .35rem .9rem; transform:rotate(-7deg); opacity:.85; white-space:nowrap; }
  .stamp.hot { color:var(--red); opacity:1; }
  details { margin-top:.9rem; max-width:48rem; }
  summary { cursor:pointer; font-stretch:80%; font-weight:600; width:max-content; border-bottom:1px solid var(--rule); padding-bottom:2px; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:' +'; color:var(--dim); }
  details[open] summary::after { content:' −'; }
  summary:hover { border-color:var(--paper); }
  details ul { margin:1rem 0 0; padding:0; list-style:none; }
  details li { position:relative; padding:.3rem 0 .3rem 1.4rem; line-height:1.5; }
  details li::before { content:''; position:absolute; left:0; top:.95rem; width:.7rem; height:1px; background:var(--dim); }
  details li.sub { padding-left:2.8rem; color:var(--dim); }
  details li.sub::before { left:1.4rem; width:.5rem; }
  .play { display:inline-block; margin-top:1rem; font-stretch:80%; font-weight:600; text-decoration:none; border-bottom:1px solid var(--rule); }
  .play:hover { border-color:var(--paper); }

  footer { position:relative; z-index:3; max-width:68rem; margin:0 auto; padding:0 64px 5rem 28px; font-size:.85rem; color:var(--dim); }
  footer a { text-decoration:none; border-bottom:1px solid var(--rule); }

  .counter { position:fixed; left:28px; bottom:22px; z-index:4; font-size:.85rem; display:flex; gap:14px; align-items:baseline; }
  .counter #num { font-stretch:62%; font-weight:700; font-size:1.6rem; font-variant-numeric:tabular-nums; }
  .counter #name { color:var(--dim); font-family:'Special Elite', ui-monospace, monospace; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; }
  .rail { position:fixed; right:28px; top:50%; transform:translateY(-50%); z-index:4; display:flex; flex-direction:column; gap:10px; }
  .rail span { width:14px; height:2px; background:var(--rule); transition:background .3s, width .3s; }
  .rail span.on { background:var(--paper); width:22px; }

  @media (max-width:720px) {
    header { padding:16px 18px; }
    header nav a { margin-left:14px; }
    main, footer { padding-left:18px; padding-right:18px; }
    .intro { grid-template-columns:1fr; gap:1.5rem; min-height:0; padding:6vh 0 4vh; }
    .board { height:430px; min-height:0; }
    .lab { grid-template-columns:1fr; }
    .idx { padding:0 0 .6rem; }
    .stamp { justify-self:start; margin:0 0 1.2rem .3rem; grid-row:2; }
    .row { grid-template-columns:1fr; gap:.1rem; }
    .counter { left:0; right:0; bottom:0; padding:22px 18px 14px; background:linear-gradient(transparent, #000 55%); }
    .rail { display:none; }
    footer { padding-bottom:6rem; }
  }
  @media (max-width:400px) { header strong a { font-size:.82rem; } header nav a { margin-left:11px; } }
  @media (prefers-reduced-motion:reduce) { .rail span { transition:none; } }
</style>
